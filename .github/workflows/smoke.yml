name: smoke
# After CI deploys the web build, load it in headless Chromium with a mode preset.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { want: 'STREETS, BLOCKS', world: 'City' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Load preset
        env:
          URL: https://andrewnakas.github.io/block-city/gl/?panel=0
          WANT: ${{ matrix.want }}
          WANT_WORLD: ${{ matrix.world }}
        run: node .github/smoke/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ strategy.job-index }}
          path: smoke.png
