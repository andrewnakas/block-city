[package]
name = "block_city"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", features = ["jpeg", "hdr", "mp3", "wav"] }
bevy_egui = "0.42"
bevy_rapier3d = "0.36.0"

[features]
webgpu = ["bevy/webgpu"]

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19", features = ["webgl2"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Location", "UrlSearchParams"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "thin"
